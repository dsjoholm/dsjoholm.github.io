<header>
  <nav class="group" style="display: flex; align-items: center; width: 100%;">
    
    <a href="{{site.baseurl}}/">
      <img class="badge" src="{{site.baseurl}}/assets/img/badge_1.png" alt="CH">
    </a>
    
    {% for node in site.pages %}
      {% unless node.nav_exclude %}
        <a href="{{node.url | prepend: site.baseurl}}" {% if page.url == node.url %}class="active"{% endif %}>
          {% if page.url == node.url %}<span class="nav-dot">•</span>{% endif %}
          {{node.title}}
          {% if page.url == node.url %}<span class="nav-dot">•</span>{% endif %}
        </a>
      {% endunless %}
    {% endfor %}

    <div style="flex-grow: 1;"></div>

    <button id="dark-mode-toggle" aria-label="Toggle Dark Mode" style="cursor:pointer; background:none; border:none; font-size:1.2rem; padding: 0; margin-left: 20px;">
      🌓
    </button>
    
  </nav>
</header>
