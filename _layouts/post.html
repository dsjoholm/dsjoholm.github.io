---
layout: default
---
<h1>{{ page.title }}</h1>
<p class="subtitle">{{ page.date | date: "%B %-d, %Y" }}</p>

{{ content }}

{% if page.tags.size > 0 %}
<div class="post-tags">
  tags:
  {% for tag in page.tags %}
    <a href="{{ '/tags/' | relative_url }}#{{ tag | slugize }}">#{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
  {% endfor %}
</div>
{% endif %}
