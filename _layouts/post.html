---
layout: default
---
<h1>{{ page.title}}</h1>
<p class="subtitle">{{ page.date | date: "%B %-d, %Y" }}</p>

{{ content }}
<div class="post-tags" style="margin-top: 2rem; font-style: italic;">
  Tags: 
  {% for tag in page.tags %}
    <a href="{{ site.baseurl }}/tags#{{ tag | slugize }}">#{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
  {% endfor %}
</div>
