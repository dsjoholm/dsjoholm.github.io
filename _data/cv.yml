experience:
  - org: CDM Smith
    location: Bellevue, WA
    dates: June 2025 – August 2025
    role: Transportation Planning Intern
    description: >-
      In this role, my first one at a private consulting company, I worked in CDM Smith's
      innovative **road user charging team** and participated in multiple projects. To aid a
      redesign of Chicago's I-290 Corridor, I wrote **policy and funding recommendations** for
      Illinois’ Blue Ribbon Commission on Transportation Infrastructure Funding and Policy. I
      helped implement and analyze data in support of new tolling technology in Washington
      State, and performed **subsidy analyses for road user charge studies** in Washington and
      Nevada.

  - org: UC San Diego Homelessness Hub
    location: San Diego, CA
    dates: October 2022 – September 2024
    role: Student Transportation and Housing Researcher
    description: >-
      As a student researcher, I was actively involved in both academic- and community-focused
      projects. Primarily, I developed and studied ways to improve the **equitability and
      sustainability** of San Diego’s transportation systems. I also served as the Homelessness
      Hub's data manager and created **geospatial datasets** on homelessness in San Diego along
      with mapping and analyzing crime and other social phenomena. Furthermore, I had the
      opportunity to liaison with government agencies like SANDAG and the City of San Diego.

  - org: San Diego Supercomputer Center
    location: San Diego, CA
    dates: August 2022 – April 2024
    role: Fire Risk and Resilience Activist
    description: >-
      I had two main roles in this position. First of all, I used the San Diego Supercomputer
      Center's resources to monitor and model, in real time, fires emerging throughout the state
      and communicate information about their potential **risk and danger** to firefighters on
      the ground. I also used proprietary climate and transportation data in order to **analyze
      the risk climate change poses** to California’s roads and rail rights-of-way.

  - org: San Diego Airport
    location: San Diego, CA
    dates: June 2023 – August 2023
    role: Airport Transit and Planning Intern
    description: >-
      My main charge as an airport transit intern was to propose a **wholesale redesign of a bus
      route** connecting the airport to a nearby rail station. To do this, I authored and
      deployed a comprehensive rider survey studying the quality of public bus service to the
      airport and used transportation modeling software to recommend a new bus route, improved
      frequency, and better wayfinding. These proposals were later put into practice by the
      airport.

  - org: UC San Diego Climate Action Resilience Scholars
    location: San Diego, CA
    dates: January 2023 – June 2023
    role: Undergraduate Research Intern
    description: >-
      This role, which was both a class and an internship, allowed me to more deeply engage in
      the San Diego community through environmental justice activism. With 25 fellow student
      interns, I helped **organize educational festivals** and engaged in project-based
      collaborative research and activism with six local environmental justice organizations. I
      also produced, wrote, and widely distributed a **[research-based newspaper](#climate-change-gazette)**
      covering transportation policy and food systems.

  - org: Target
    location: San Diego, CA
    dates: March 2021 – September 2021
    role: Cashier
    description: >-
      This was my first ever job. As a cashier, I received praise for my problem solving
      abilities and was quickly allowed to begin training other new cashiers.

